# Digifly • App Hosting Configuration
# Version: 1.3.25 • DGF-342

runtime: nodejs18

# --- Build pipeline ---
build:
  command: npm run build
  # Ensures Turbopack is disabled to avoid unstable edge builds
  env:
    NEXT_RUNTIME: nodejs
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    FIREBASE_DEBUG_MODE: "false"

# --- Start command ---
run:
  command: npm run start
  env:
    NODE_ENV: production
    NEXT_RUNTIME: nodejs
    NEXT_SHARP_PATH: node_modules/sharp
    NEXT_PRIVATE_TARGET: server
    FIREBASE_DEBUG_MODE: "false"

# --- Deployment ---
automaticScaling:
  maxInstances: 3
  minInstances: 1
  targetCPUUtilization: 0.6

# --- Routing and cache ---
handlers:
  - url: /_next/static
    static_dir: .next/static
    cache_control: public, max-age=31536000, immutable

  - url: /favicon.ico
    static_files: public/favicon.ico
    upload: public/favicon.ico

  - url: /.*
    script: auto

# --- Logging ---
logging:
  level: info

# --- Notes ---
# - Forces Node runtime for all functions & pages
# - Prevents Edge runtime from being used by Firebase Hosting
# - Safe for Next.js 15.x / Turbopack