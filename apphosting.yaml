# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

# The command to build your app
build:
  command: "npm run build"
# After a successful deployment, run Playwright tests against the live URL.
# The `|| true` ensures that the build doesn't fail if tests fail.
postbuild:
  command: "npm run report:e2e || echo 'Playwright report generation failed, continuing deploy...'"

postdeploy:
  command: "BASE_URL=${LIVE_URL} npm run postdeploy || true"

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
